<div class="tabs">
    <div class="tab"
         [class.checked]="curTab() === 'one-day-tab'"
         (click)="setTab('one-day-tab')">One-day forecast
    </div>
    <div class="line">|</div>
    <div class="tab"
         [class.checked]="curTab() === 'five-day-tab'"
         (click)="setTab('five-day-tab')">Five-day forecast
    </div>
</div>
<div class="table">
    <app-tab [curTab]="curTab()">
    </app-tab>
</div>
