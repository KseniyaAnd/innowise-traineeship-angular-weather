<p class="p-title">
    @if (selectedCity()?.cityName) {
        {{ selectedCity()?.cityName }}
    } @else {
        Weather
    }
</p>
<app-search
        [items]="cities()"
        [loading]="loading()"
        [itemName]="(selectedCity()?.cityName)!"
        (onInputEvent)="getCities($event)"
        (onClickEvent)="getCity($event)"
></app-search>
<app-tabs (onClickEvent)="setTab($event)"></app-tabs>
<app-table [curTab]="tab()"></app-table>
